<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 110" width="420" height="110" role="img" aria-label="AegisInfra Logo">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
  </defs>

  <!-- Rounded dark pill backing so logo & text stay crisp on both GitHub light & dark themes -->
  <rect x="4" y="6" width="412" height="98" rx="18" fill="#0f172a" stroke="#1e293b" stroke-width="2" />

  <!-- Cybersecurity Shield Emblem -->
  <path d="M56 20 L86 31 V54 C86 73 72 86 56 92 C40 86 26 73 26 54 V31 Z"
        fill="url(#shieldGrad)" stroke="url(#accentGrad)" stroke-width="3" stroke-linejoin="round" />

  <!-- Server Rack Nodes inside Shield -->
  <rect x="39" y="39" width="34" height="8" rx="2.5" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
  <circle cx="45" cy="43" r="1.8" fill="#38bdf8" />
  <line x1="51" y1="43" x2="67" y2="43" stroke="#94a3b8" stroke-width="1.8" stroke-linecap="round" />

  <rect x="39" y="51" width="34" height="8" rx="2.5" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
  <circle cx="45" cy="55" r="1.8" fill="#2563eb" />
  <line x1="51" y1="55" x2="67" y2="55" stroke="#94a3b8" stroke-width="1.8" stroke-linecap="round" />

  <rect x="39" y="63" width="34" height="8" rx="2.5" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
  <circle cx="45" cy="67" r="1.8" fill="#38bdf8" />
  <line x1="51" y1="67" x2="67" y2="67" stroke="#94a3b8" stroke-width="1.8" stroke-linecap="round" />

  <!-- Brand Typography -->
  <text x="106" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="34" font-weight="800" letter-spacing="-0.5" fill="#f8fafc">
    Aegis<tspan fill="#38bdf8">Infra</tspan>
  </text>
  <text x="108" y="79" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="11.5" font-weight="600" letter-spacing="1.6" fill="#94a3b8">
    INFRASTRUCTURE SECURITY AUDITOR
  </text>
</svg>
