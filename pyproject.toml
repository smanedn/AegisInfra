[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aegisinfra"
version = "1.0.0"
description = "Security auditing CLI for self-hosted infrastructure, Docker, and Proxmox VE."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pyyaml>=6.0.1",
    "docker>=7.0.0",
    "proxmoxer>=2.0.1",
    "requests>=2.31.0",
    "jinja2>=3.1.3",
    "weasyprint>=61.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
aegisinfra = "main:app"

[tool.setuptools]
py-modules = ["main", "models", "start", "healthcheck"]
packages = ["scanner", "remediator", "reporter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
